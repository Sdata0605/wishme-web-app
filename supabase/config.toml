# Vapi calls this with a shared secret header (x-vapi-secret), not a Supabase login, so the gateway
# must not demand a JWT. The function itself rejects anything without the right secret.
[functions.ai-call-webhook]
verify_jwt = false

# The phone network calls this (ringing, answered, hung up, and the live audio stream) and cannot
# log in, so the gateway must not demand a JWT. Every URL carries a token derived from the call id
# and AI_CALL_WEBHOOK_SECRET, and the function rejects anything else.
[functions.vobiz-call]
verify_jwt = false


