<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent stale cache in production -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Primary Meta Tags -->
    <title>Wish Me - Celebrity Wishes That Last Forever | Book Personalized Video Messages</title>
    <meta name="title" content="Wish Me - Celebrity Wishes That Last Forever | Book Personalized Video Messages" />
    <meta name="description" content="Request personalized video wishes from your favorite celebrities in India. Get custom birthday wishes, anniversary messages, and promotional content from 1000+ verified celebrities. Fast 24-hour delivery." />
    <meta name="keywords" content="celebrity wishes, personalized video messages, celebrity shoutouts, book celebrity video, celebrity birthday wishes, India celebrities, promotional videos" />
    <meta name="author" content="Wish Me" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://wishme.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wishme.com/" />
    <meta property="og:title" content="Wish Me - Celebrity Wishes That Last Forever" />
    <meta property="og:description" content="Request personalized wishes from your favorite celebrities. Send wishes that last forever with our premium celebrity platform." />
    <meta property="og:image" content="https://wishme.com/logo.png" />
    <meta property="og:site_name" content="Wish Me" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wishme.com/" />
    <meta name="twitter:title" content="Wish Me - Celebrity Wishes That Last Forever" />
    <meta name="twitter:description" content="Request personalized wishes from your favorite celebrities in India. Fast 24-hour delivery." />
    <meta name="twitter:image" content="https://wishme.com/logo.png" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Scripts -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Wish Me",
      "url": "https://wishme.com/",
      "description": "Premium celebrity wishes and personalized video messages platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://wishme.com/celebrities?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Wish Me",
      "url": "https://wishme.com/",
      "logo": "https://wishme.com/logo.png",
      "description": "India's premier platform for booking personalized celebrity video messages",
      "sameAs": [
        "https://twitter.com/wishme_official",
        "https://facebook.com/wishme",
        "https://instagram.com/wishme"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["en", "hi"]
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
